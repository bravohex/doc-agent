[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "doc-agent"
version = "0.1.0"
description = "Local-first Office document knowledge package for retrieval-efficient agents"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "bravohex" }]
dependencies = [
  "pydantic>=2.8,<3",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
  "lxml>=5,<7",
  "Pillow>=10,<13",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "nicegui>=3,<4",
  "mcp>=1.0,<2",
]

[project.scripts]
doc-agent = "doc_agent.interfaces.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "pyright>=1.1.390,<2",
  "pre-commit>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doc_agent"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
# NiceGUI's user simulation drives the real page from async tests, and it looks for a
# main file unless told the app is composed by the test itself.
asyncio_mode = "auto"
main_file = ""

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Ruff's formatter deliberately does not wrap long string literals such as SQL.
# E501 is therefore redundant with the formatter and noisy for readable SQL statements.
ignore = ["B008", "E501"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["tests"]
reportMissingTypeStubs = false
