name: TDD ingest ownership

on:
  push:
    branches:
      - feat/full-doc-agent-implementation

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pydantic
      - run: PYTHONPATH=src python -m pytest tests/unit/application/test_ingest.py::test_replace_rejects_foreign_project_before_same_hash_shortcut -q
