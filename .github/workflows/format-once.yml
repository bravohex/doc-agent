name: Format once

on:
  push:
    branches:
      - feat/full-doc-agent-implementation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: Format and remove this temporary workflow
        run: |
          python -m ruff format .
          python -m ruff check --fix . || true
          rm .github/workflows/format-once.yml
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style: format final implementation'
            git push origin HEAD:feat/full-doc-agent-implementation
          fi
