name: TDD XLSX stable identity

on:
  push:
    branches:
      - feat/full-doc-agent-implementation

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/integration/extractors/test_xlsx.py::test_xlsx_row_identity_survives_row_insertion -q
