name: Bootstrap implementation

on:
  push:
    branches:
      - feat/full-doc-agent-implementation

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize implementation bundle
        run: |
          test -f .bootstrap/source.tgz
          tar -xzf .bootstrap/source.tgz
          rm -rf .bootstrap
          rm .github/workflows/bootstrap.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement document knowledge agent'
          git push origin HEAD:feat/full-doc-agent-implementation
