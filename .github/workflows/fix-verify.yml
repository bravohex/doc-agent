name: Format and verify implementation

on:
  push:
    branches:
      - feat/full-doc-agent-implementation

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply deterministic formatting and safe lint fixes
        run: |
          python -m ruff format .
          python -m ruff check --fix .
      - name: Persist formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply ruff formatting'
            git push origin HEAD:feat/full-doc-agent-implementation
          fi
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Pyright
        run: python -m pyright
      - name: Tests
        run: python -m pytest --cov=doc_agent --cov-report=term-missing --cov-fail-under=80
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w dist
      - name: Remove one-time workflow after success
        run: |
          rm .github/workflows/fix-verify.yml
          git add -A
          git commit -m 'chore: remove one-time verification workflow'
          git push origin HEAD:feat/full-doc-agent-implementation
